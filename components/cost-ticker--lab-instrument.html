.digits .col { display: inline-block; width: .62em; height: 1em; overflow: hidden; }

.scope { position: relative; border-radius: 8px; background: var(--hx-lcd); box-shadow: inset 0 3px 8px #000, 0 0 0 1.5px var(--hx-edge); overflow: hidden; min-height: 96px; }

.ctl { display: flex; align-items: center; justify-content: space-between; gap: 14px; }

.knobwrap.drag .k-cap { transition: none; }
.k-num { font: 500 8px var(--hx-mono); fill: var(--hx-silk); text-anchor: middle; }
.inst[data-off="1"] .knobwrap { opacity: .5; pointer-events: none; }
.swbox { display: flex; flex-direction: column; align-items: stretch; gap: 6px; min-width: 0; }
.sw { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 4px 6px; border: 0; border-radius: 8px; background: transparent; text-align: left; }
.sw .track { position: relative; flex: none; width: 46px; height: 24px; border-radius: 12px; background: #A59E88; box-shadow: inset 0 2px 4px rgba(0, 0, 0, .4); transition: background-color .3s; }
.sw .lever { position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFF, #C9C2AC); box-shadow: 0 1px 3px rgba(0, 0, 0, .5); transition: transform .45s cubic-bezier(.2, .9, .25, 1.35); }

.sw:disabled { opacity: .5; cursor: default; }
.sw .t { font-size: 12px; line-height: 1.35; font-weight: 500; }
.sw .t small { display: block; font-size: 11px; font-weight: 400; color: var(--hx-silk-2); }
.dbtn { min-height: 44px; padding: 0 12px; border: 0; border-radius: 8px; background: linear-gradient(#F4EFE0, #CFC7B0); box-shadow: 0 3px 0 #8B8470, 0 0 0 1px rgba(0, 0, 0, .15); font-size: 12px; font-weight: 700; letter-spacing: .06em; color: var(--hx-silk); transition: transform .08s, box-shadow .08s; }

.detail.open { grid-template-rows: 1fr; }

.detail ul { list-style: none; margin: 12px 4px 0; padding: 10px 12px; border-radius: 8px; background: var(--hx-lcd); color: var(--hx-phos); font: 12px/1.9 var(--hx-mono); box-shadow: inset 0 3px 8px #000; }

.inst[data-t="bad"] .status .m, .inst[data-t="bad"][data-st="error"] .status .m { color: var(--hx-bad); font-weight: 700; }

@media (max-width: 440px) { .mid, .low { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { .digits .strip { transition-duration: 2s; } .bar i.top, .digits .dash { animation: none; } }
</style>

<body>
<div class="page">
  <header class="head">
    <div>
      <h1>费用计数 · 实验室仪器</h1>
      <p>一台桌面仪器：指针表盘、液晶读数、LED 速率条、示波屏、限额旋钮。Agent 一路花钱，你一眼看到离上限多远。</p>
      <p>适合的 harness：通用核心（任何 harness 都要有，长时间自动运行的 Agent 尤其需要）</p>
    </div>
    <div class="simbtns"><button type="button" class="pbtn" id="theme" aria-pressed="false">深色页面</button></div>
  </header>

  <section class="main" aria-label="主组件">
    <div class="mcol">
      <div class="lab">可交互 · 拖动或用方向键转旋钮改上限，拨动开关切换更便宜的模型（演示按 6 倍速计费）</div>
      <div id="main"></div>
    </div>
    <div class="sim">
      <h2>模拟 Agent</h2>
      <div class="simbtns" id="sim"></div>
      <h2>Agent 回传</h2>
      <pre class="log" id="log" aria-live="polite">（转旋钮、拨开关、看明细，这里显示 hx-action）</pre>
    </div>
  </section>

  <section class="gal" aria-label="全部状态">
    <h2>全部状态</h2>
    <div class="grid" id="gallery"></div>
  </section>
</div>

<script>
(function () {
  'use strict';
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var clamp = function (x, a, b) { return Math.min(b, Math.max(a, x)); };
  var CAPS = [5, 10, 15, 20, 30, 50], RATE_MAX = 0.4, SEG = 10, N0 = 0;

  var TEMPLATE =
    '<i class="screw a"></i><i class="screw b"></i><i class="screw c"></i><i class="screw d"></i>' +
    '<div class="row1"><span class="silk">SESSION COST<small>本次花费</small></span><span class="pwr"><span class="silk" data-f="model">—</span><i class="led on" data-f="pwr" aria-hidden="true"></i><i class="led st" aria-hidden="true"></i></span></div>' +
    '<div class="mid">' +
      '<div class="gauge"><svg viewBox="0 0 240 140" aria-hidden="true"><g data-f="ticks"></g>' +
        '<path class="g-red" data-f="red" d="M0 0"/>' +
        '<text class="g-label" x="120" y="92">预算占用</text>' +
        '<g class="g-needle" data-f="needle"><line x1="120" y1="124" x2="120" y2="30"/><line x1="120" y1="124" x2="120" y2="136" style="stroke-width:4"/></g><circle class="g-hub" cx="120" cy="124" r="7"/></svg><div class="g-glass" aria-hidden="true"></div></div>' +
      '<div class="read">' +
        '<div class="lcd"><div class="lbl">SPEND · CNY</div><div class="digits" data-f="digits" role="img"></div><div class="eta" data-f="eta"></div></div>' +
        '<div class="ratebox"><div class="rate"><span class="silk">速率</span><span data-f="rate">—</span></div><div class="bar" data-f="bar"></div></div>' +
      '</div>' +
    '</div>' +
    '<div class="low">' +
      '<div class="scope"><canvas data-f="scope" aria-hidden="true"></canvas><span class="tag">COST / TIME</span></div>' +
      '<div class="ctl">' +
        '<div class="knobbox"><div class="knobwrap" data-f="knobwrap"><input type="range" min="0" max="' + (CAPS.length - 1) + '" step="1" value="1" data-f="knob" aria-label="费用上限（元）">' +
          '<svg viewBox="0 0 72 72" aria-hidden="true"><g data-f="knobticks"></g><g class="k-cap" data-f="kcap"><circle cx="36" cy="36" r="22" fill="#2E2A22"/><circle cx="36" cy="36" r="19" fill="#4A443A"/><circle cx="36" cy="36" r="19" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="1"/><path d="M36 20v10" stroke="#F4EFE0" stroke-width="2.5" stroke-linecap="round"/></g></svg></div><span class="silk">上限<small data-f="capv">—</small></span></div>' +
        '<div class="swbox"><button type="button" class="sw" role="switch" aria-checked="false" data-f="sw"><span class="track" aria-hidden="true"><i class="lever"></i></span><span class="t"><span data-f="swt">改用更便宜的模型</span><small data-f="sws"></small></span></button>' +
          '<button type="button" class="dbtn" data-f="dbtn" aria-expanded="false">看明细</button></div>' +
      '</div>' +
    '</div>' +
    '<div class="detail" data-f="detail"><div><ul data-f="dlist" aria-label="花费明细"></ul></div></div>' +
    '<div class="status" data-f="status" aria-live="polite"></div>';

  function fmt(n) { return Number(n).toFixed(2); }

  /**
   * props: { state: 'loading'|'ready'|'error', spend, rate（元/分钟）, cap, model, cheaper: { name, saving }, switched, series: [元…], items: [[名称, 金额]…], error }
   * 字段还没到就是 null：位置已经留好，到了再动起来。
   * 动作（hx-action）：set-cap { cap } / switch-model { to } / show-details { open } / retry
   */
  var loopSet = [], raf = 0, last = 0;
  function loop(now) {
    var dt = Math.min(.05, (now - last) / 1000); last = now;
    loopSet.forEach(function (f) { f(now, dt); });

  }
  function addLoop(f) { loopSet.push(f); if (!raf) { last = performance.now(); raf = requestAnimationFrame(loop); } }

  function mount(root, init, opts) {

    var $ = function (f) { return root.querySelector('[data-f="' + f + '"]'); };
    var el = {}; ['model', 'pwr', 'ticks', 'red', 'needle', 'digits', 'eta', 'rate', 'bar', 'scope', 'knobwrap', 'knob', 'knobticks', 'kcap', 'capv', 'sw', 'swt', 'sws', 'dbtn', 'detail', 'dlist', 'status'].forEach(function (k) { el[k] = $(k); });
    var s = { state: 'loading', spend: null, rate: null, cap: null, model: null, cheaper: null, switched: false, series: null, items: null, error: null, open: false };
    var ang = -80, vel = 0, calmUntil = 0, nextBlink = performance.now() + 5000, lastDigits = '', lastLen = -1, liveT = 0;
    var ctx = el.scope.getContext('2d'), segs = [];

    for (var i = 0; i < SEG; i++) { var b = document.createElement('i'); b.style.setProperty('--d', (i * 0.045) + 's'); el.bar.appendChild(b); segs.push(b); }
