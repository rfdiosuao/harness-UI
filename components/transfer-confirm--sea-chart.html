<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>转账确认卡 · 航海海图</title>
<meta name="hx-component" content="transfer-confirm">
<meta name="hx-style" content="sea-chart">
<meta name="hx-harness" content="金融支付助手、个人理财助手">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
:root {
  --hx-page: #E7E3DA;
  --hx-page-ink: #2B2F36;
  --hx-page-ink-2: #566070;
  --hx-page-line: #CFC9BC;
  --hx-paper: #EBDFC2;
  --hx-paper-2: #E0D0A8;
  --hx-ink: #1F2A3A;
  --hx-ink-2: #46505F;
  --hx-blue: #27527A;
  --hx-line: rgba(39, 82, 122, .34);
  --hx-brown: #6B4A2B;
  --hx-red: #B6361F;
  --hx-btn-bg: #1F3A5A;
  --hx-btn-fg: #F4EBD3;
  --hx-btn-shadow: #0F2036;
  --hx-grain: .16;
  --hx-focus: #B6361F;
  --hx-radius: 14px;
  --hx-font-ui: 'Noto Sans SC', system-ui, sans-serif;
  --hx-font-num: 'DM Mono', ui-monospace, monospace;
  --hx-font-hand: 'Ma Shan Zheng', 'Noto Sans SC', cursive;
  --z: 1;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --dark: 1; }
}
:root[data-theme="dark"], :root:not([data-theme="light"]) .force-dark-probe { --dark: 1; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --hx-page: #0B1520; --hx-page-ink: #E6EAF0; --hx-page-ink-2: #9FB0C4; --hx-page-line: #1D2E40;
    --hx-paper: #14273A; --hx-paper-2: #0F2031; --hx-ink: #EADFC4; --hx-ink-2: #AFC3D6;
    --hx-blue: #8DB4D9; --hx-line: rgba(141, 180, 217, .32); --hx-brown: #C9A06C; --hx-red: #F08A6E;
    --hx-btn-bg: #EADFC4; --hx-btn-fg: #14273A; --hx-btn-shadow: #8E7F5E; --hx-grain: .07; --hx-focus: #F08A6E;
  }
}
:root[data-theme="dark"] {
  --hx-page: #0B1520; --hx-page-ink: #E6EAF0; --hx-page-ink-2: #9FB0C4; --hx-page-line: #1D2E40;
  --hx-paper: #14273A; --hx-paper-2: #0F2031; --hx-ink: #EADFC4; --hx-ink-2: #AFC3D6;
  --hx-blue: #8DB4D9; --hx-line: rgba(141, 180, 217, .32); --hx-brown: #C9A06C; --hx-red: #F08A6E;
  --hx-btn-bg: #EADFC4; --hx-btn-fg: #14273A; --hx-btn-shadow: #8E7F5E; --hx-grain: .07; --hx-focus: #F08A6E;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--hx-page); color: var(--hx-page-ink); font-family: var(--hx-font-ui); line-height: 1.6; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--hx-focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ---------- 页面（保持素净） ---------- */
.page { max-width: 980px; margin: 0 auto; padding: 32px 20px 56px; display: flex; flex-direction: column; gap: 28px; }
.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.head h1 { margin: 0; font-size: 20px; font-weight: 700; }
.head p { margin: 2px 0 0; font-size: 13px; color: var(--hx-page-ink-2); }
.tools { display: flex; flex-wrap: wrap; gap: 8px; }
.chipbtn { min-height: 44px; padding: 0 14px; border: 1px solid var(--hx-page-line); border-radius: 10px; background: transparent; font-size: 13px; }
.chipbtn[aria-pressed="true"] { background: var(--hx-page-ink); color: var(--hx-page); border-color: var(--hx-page-ink); }
.main { display: flex; flex-wrap: wrap; gap: 28px 40px; align-items: flex-start; }
.stage-col { display: flex; flex-direction: column; gap: 10px; }
.label { font-size: 12px; color: var(--hx-page-ink-2); }
.stage { width: calc(160px * var(--z)); height: calc(160px * var(--z)); }
.stage > .wg { transform: scale(var(--z)); transform-origin: 0 0; }
.sim { flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.sim h2, .gallery h2 { margin: 0; font-size: 13px; font-weight: 700; }
.simbtns { display: flex; flex-wrap: wrap; gap: 8px; }
.log { margin: 0; padding: 12px 14px; border: 1px solid var(--hx-page-line); border-radius: 10px; font: 12px/1.7 var(--hx-font-num); color: var(--hx-page-ink); white-space: pre-wrap; overflow-wrap: anywhere; min-height: 86px; }
.log .k { color: var(--hx-page-ink-2); }
.gallery { display: flex; flex-direction: column; gap: 14px; }
.grid { display: flex; flex-wrap: wrap; gap: 22px; }
.cell { display: flex; flex-direction: column; gap: 8px; }

/* ---------- 卡片本体：160 × 160 ---------- */
.wg {
  position: relative; width: 160px; height: 160px; border-radius: var(--hx-radius); overflow: hidden;
  background: var(--hx-paper); color: var(--hx-ink); font-family: var(--hx-font-ui);
  box-shadow: 0 0 0 1px rgba(0, 0, 0, .14), 0 6px 14px -8px rgba(15, 32, 54, .55);
  isolation: isolate;
}
.wg::after { /* 纸纹 */
  content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none; opacity: var(--hx-grain); mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' seed='4'/><feColorMatrix values='0 0 0 0 .25  0 0 0 0 .2  0 0 0 0 .1  0 0 0 .9 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
.chart { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }
.chart .contour { fill: none; stroke: var(--hx-line); stroke-width: 1; }
.chart .frame { fill: none; stroke: var(--hx-blue); stroke-opacity: .55; }
.chart .tick { stroke: var(--hx-blue); stroke-opacity: .5; stroke-width: 1; }
.chart .depth { font: 7px var(--hx-font-num); fill: var(--hx-blue); fill-opacity: .6; }

.who { position: absolute; z-index: 2; left: 13px; top: 11px; width: 98px; }
.payee { font: 400 14px/1.25 var(--hx-font-hand); color: var(--hx-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.memo { margin-top: 1px; font-size: 12px; line-height: 1.3; color: var(--hx-ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.memo.risk { display: inline-block; max-width: 100%; margin-top: 3px; padding: 0 5px; border: 1.5px solid var(--hx-red); border-radius: 3px; color: var(--hx-red); font-weight: 700; transform: rotate(-2.5deg); }

.amt { position: absolute; z-index: 2; left: 13px; right: 13px; top: 46px; height: 36px; display: flex; align-items: center; font: 500 29px/1 var(--hx-font-num); color: var(--hx-ink); letter-spacing: -.02em; }
.amt.small { font-size: 23px; }
.amt .cur { margin-right: 2px; font-size: .62em; color: var(--hx-brown); font-weight: 500; transform: translateY(.05em); }
.amt .col { display: inline-block; width: .62em; height: 1em; overflow: hidden; }
.amt .strip { display: block; transform: translateY(calc(var(--d, 0) * -1em)); transition: transform var(--dur, .9s) cubic-bezier(.2, .9, .25, 1.08) var(--delay, 0s); }
.amt .strip span { display: block; height: 1em; line-height: 1; text-align: center; }
.amt .sep { display: inline-block; width: .34em; text-align: center; }
.amt.sk .ghost { display: inline-block; width: .5em; height: .62em; margin-right: .12em; border-radius: 2px; background: var(--hx-line); animation: pulse 1.4s ease-in-out infinite; }
.amt.sk .ghost:nth-child(2) { animation-delay: .12s; } .amt.sk .ghost:nth-child(3) { animation-delay: .24s; } .amt.sk .ghost:nth-child(4) { animation-delay: .36s; } .amt.sk .ghost:nth-child(5) { animation-delay: .48s; }
.skbar { display: block; height: 11px; width: 78px; border-radius: 3px; background: var(--hx-line); animation: pulse 1.4s ease-in-out infinite; }
.skbar.s { width: 52px; height: 9px; margin-top: 6px; animation-delay: .2s; }
@keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }

.route { position: absolute; z-index: 1; left: 0; top: 84px; width: 160px; height: 30px; overflow: visible; }
.route .base { fill: none; stroke: var(--hx-blue); stroke-width: 1.4; stroke-dasharray: 2 4; stroke-linecap: round; opacity: .55; }
.route .prog { fill: none; stroke: var(--hx-ink); stroke-width: 1.8; stroke-linecap: round; }
.route .pt { fill: var(--hx-paper); stroke: var(--hx-ink); stroke-width: 1.5; }
.route .boat { fill: var(--hx-ink); transition: opacity .2s; }
.route .anchor { fill: none; stroke: var(--hx-ink); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; opacity: 0; transform-origin: 140px 94px; transition: opacity .25s, transform .5s cubic-bezier(.2, .9, .25, 1.4); transform: translateY(-6px) scale(.8); }
.route .blot { fill: var(--hx-red); opacity: 0; transition: opacity .25s; }
.wg[data-view="done"] .anchor { opacity: 1; transform: none; }
.wg[data-view="done"] .endpt { opacity: 0; }
.wg[data-view="error"] .blot { opacity: .85; }
.wg[data-view="cancelled"] .prog, .wg[data-view="cancelled"] .boat { opacity: 0; }
.wg[data-view="cancelled"] .base { opacity: .25; }

.go {
  position: absolute; z-index: 2; left: 12px; right: 12px; bottom: 8px; min-height: 40px; padding: 0 10px; border: 0; border-radius: 10px;
  background: var(--hx-btn-bg); color: var(--hx-btn-fg); font-size: 13px; font-weight: 700; letter-spacing: .02em;
  box-shadow: 0 3px 0 var(--hx-btn-shadow); display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: transform .12s, box-shadow .12s, background-color .2s;
}
.go:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--hx-btn-shadow); }
.go:disabled { cursor: default; }
.go[data-tone="armed"] { background: var(--hx-red); color: var(--hx-paper); box-shadow: 0 3px 0 rgba(0, 0, 0, .35); }
.go[data-tone="ghost"] { background: var(--hx-paper); color: var(--hx-ink); box-shadow: inset 0 0 0 1.5px var(--hx-ink); }
.go[data-tone="wait"] { background: var(--hx-paper-2); color: var(--hx-ink-2); box-shadow: inset 0 0 0 1.5px var(--hx-line); }
.go svg { flex: none; }

.rose { position: absolute; z-index: 3; top: 0; right: 0; width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: transparent; color: var(--hx-blue); }
.rose svg { transition: transform .45s cubic-bezier(.2, .9, .25, 1.2); }
.rose:hover svg { transform: rotate(14deg); }
.wg.menu-open .rose svg { transform: rotate(45deg); }

.legend {
  position: absolute; z-index: 4; inset: 0; padding: 46px 12px 10px; display: flex; flex-direction: column; gap: 8px;
  background: var(--hx-paper); transform: translateY(-102%); transition: transform .32s cubic-bezier(.2, .9, .25, 1);
}
.wg.menu-open .legend { transform: none; }
.legend h3 { position: absolute; top: 14px; left: 13px; margin: 0; font: 400 14px/1.2 var(--hx-font-hand); color: var(--hx-ink-2); }
.legend button { min-height: 44px; border: 1.5px solid var(--hx-ink); border-radius: 10px; background: transparent; font-size: 13px; font-weight: 700; color: var(--hx-ink); display: flex; align-items: center; justify-content: center; gap: 6px; }
.legend button.danger { border-color: var(--hx-red); color: var(--hx-red); }

@media (prefers-reduced-motion: reduce) {
  .amt .strip { --dur: 1.6s; }
  .rose svg, .legend, .route .anchor { transition-duration: .01s; }
  .amt.sk .ghost, .skbar { animation: none; opacity: .8; }
}
</style>
</head>
<body>
<div class="page">
  <header class="head">
    <div>
      <h1>转账确认卡 · 航海海图</h1>
      <p>Agent 在回答里画出的 160×160 小组件。数字像里程表滚动，转账是一次航行。</p>
      <p>适合的 harness：金融支付助手、个人理财助手（记账、转账、缴费这类要用户最后点头的场景）</p>
    </div>
    <div class="tools">
      <button type="button" class="chipbtn" id="zoom" aria-pressed="false">放大到 2×</button>
      <button type="button" class="chipbtn" id="theme" aria-pressed="false">夜航（深色）</button>
    </div>
  </header>

  <section class="main" aria-label="主卡片">
    <div class="stage-col">
      <div class="label">可交互 · 点罗盘打开菜单</div>
      <div class="stage"><div class="wg" id="main-card"></div></div>
    </div>
    <div class="sim">
      <h2>模拟 Agent</h2>
      <div class="simbtns" id="sim"></div>
      <h2>Agent 回传</h2>
      <pre class="log" id="log" aria-live="polite">（点卡片上的按钮，这里显示 hx-action）</pre>
    </div>
  </section>

  <section class="gallery" aria-label="全部状态">
    <h2>全部状态</h2>
    <div class="grid" id="gallery"></div>
  </section>
</div>

<script>
(function () {
  'use strict';
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var NS = 'http://www.w3.org/2000/svg';

  var TEMPLATE =
    '<svg class="chart" viewBox="0 0 160 160" aria-hidden="true">' +
      '<path class="contour" d="M-4 132 C 22 118, 40 142, 72 128 S 124 112, 164 132"/>' +
      '<path class="contour" d="M-4 144 C 26 132, 46 154, 80 142 S 128 128, 164 146"/>' +
      '<path class="contour" d="M-4 56 C 18 46, 30 66, 52 58 S 86 42, 104 56"/>' +
      '<path class="contour" d="M110 150 C 126 140, 140 150, 164 138"/>' +
      '<rect class="frame" x="4.5" y="4.5" width="151" height="151" rx="10"/>' +
      '<path class="tick" d="M4.5 40h5M4.5 80h5M4.5 120h5M155.5 40h-5M155.5 80h-5M155.5 120h-5M40 4.5v5M80 4.5v5M120 4.5v5M40 155.5v-5M80 155.5v-5M120 155.5v-5"/>' +
    '</svg>' +
    '<div class="who"><div class="payee" data-f="payee"></div><div class="memo" data-f="memo"></div></div>' +
    '<div class="amt" data-f="amt" role="img"></div>' +
    '<svg class="route" viewBox="0 0 160 30" aria-hidden="true">' +
      '<path class="base" d="M20 20 C 50 4, 90 32, 140 14"/>' +
      '<path class="prog" d="M20 20 C 50 4, 90 32, 140 14"/>' +
      '<circle class="pt" cx="20" cy="20" r="3.4"/>' +
      '<circle class="pt endpt" cx="140" cy="14" r="3.4"/>' +
      '<g class="anchor"><circle cx="140" cy="7" r="2.2"/><path d="M140 9.2V22M135.5 13h9M134 18.5c.8 3 3.2 4.5 6 4.5s5.2-1.5 6-4.5"/></g>' +
      '<g class="boat"><path d="M-4 3h8l-2 3h-4zM0 2V-7l4.5 8z"/></g>' +
      '<circle class="blot" r="4.2"/>' +
    '</svg>' +
    '<button type="button" class="go" data-f="go"></button>' +
    '<button type="button" class="rose" data-f="rose" aria-label="更多操作" aria-expanded="false">' +
      '<svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true">' +
        '<circle cx="15" cy="15" r="10.5"/><circle cx="15" cy="15" r="7" stroke-opacity=".5"/>' +
        '<path d="M15 3.5l2.4 8.1 8.1 3.4-8.1 3.4L15 26.5l-2.4-8.1L4.5 15l8.1-3.4z" fill="currentColor" fill-opacity=".85"/>' +
        '<path d="M15 1.5v3"/>' +
      '</svg>' +
    '</button>' +
    '<div class="legend" data-f="legend" inert>' +
      '<h3>图例</h3>' +
      '<button type="button" data-f="edit"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.5 2.5l3 3L6 13l-3.5.5L3 10z"/></svg>改金额</button>' +
      '<button type="button" class="danger" data-f="cancel"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>取消转账</button>' +
    '</div>' +
    '<div class="sr" aria-live="polite" data-f="live"></div>';

  function fmt(n) { return Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function hhmm() { var d = new Date(); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }

  /**
   * 挂载一张卡片。返回 { set(props), get() }。
   * props: { state: 'loading'|'ready'|'confirming'|'done'|'error'|'cancelled',
   *          payee, account, amount, currency, memo, risk: 'normal'|'first-time-payee', error, doneAt }
   * 动作（hx-action）: confirm / cancel / edit-amount / retry
   */
  function mount(root, init, opts) {
    opts = opts || {};
    root.innerHTML = TEMPLATE;
    var $ = function (f) { return root.querySelector('[data-f="' + f + '"]'); };
    var el = { payee: $('payee'), memo: $('memo'), amt: $('amt'), go: $('go'), rose: $('rose'), legend: $('legend'), edit: $('edit'), cancel: $('cancel'), live: $('live') };
    var prog = root.querySelector('.prog'), boat = root.querySelector('.boat'), blot = root.querySelector('.blot');
    var total = prog.getTotalLength();
    var s = { state: 'loading', payee: null, account: null, amount: null, currency: 'CNY', memo: null, risk: 'normal', error: null, doneAt: null };
    var armed = false, armTimer = 0, settleTimer = 0, anim = 0, p = 0, lastLen = -1, lastSpoken = '';

    function emit(name, params) {
      var ev = new CustomEvent('hx-action', { detail: { name: name, params: params || {} }, bubbles: !!opts.global });
      (opts.global ? document : root).dispatchEvent(ev);
    }

    function setProg(v) {
      p = v;
      prog.style.strokeDasharray = total;
      prog.style.strokeDashoffset = total * (1 - v);
      var pt = prog.getPointAtLength(total * v), q = prog.getPointAtLength(Math.min(total, total * v + 1));
      var ang = Math.atan2(q.y - pt.y, q.x - pt.x) * 180 / Math.PI;
      var tip = s.state === 'error' ? 16 : 0;
      boat.setAttribute('transform', 'translate(' + pt.x + ' ' + (pt.y - 3) + ') rotate(' + (ang * 0.5 + tip) + ')');
      boat.style.opacity = (v <= 0.001 || (v >= 0.999 && s.state === 'done')) ? 0 : 1;
      blot.setAttribute('cx', pt.x); blot.setAttribute('cy', pt.y);
    }
    function sail(to, ms, done) {
      cancelAnimationFrame(anim);
      var from = p, t0 = performance.now(); ms = reduce ? ms * 2.2 : ms;
      (function step(now) {
        var k = Math.min(1, (now - t0) / ms), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
        setProg(from + (to - from) * e);
        if (k < 1) anim = requestAnimationFrame(step); else if (done) done();
      })(t0);
    }

    function renderAmount() {
      var a = el.amt;
      if (s.amount == null || s.state === 'loading') {
        a.className = 'amt sk'; a.setAttribute('aria-label', '金额加载中'); a.dataset.str = '';
        a.innerHTML = '<span class="ghost"></span><span class="ghost"></span><span class="ghost"></span><span class="ghost"></span><span class="ghost"></span>';
        lastLen = -1; return;
      }
      var str = fmt(s.amount), chars = str.split('');
      a.className = 'amt' + (str.length > 8 ? ' small' : '');
      a.setAttribute('aria-label', str + ' 元');
      var rebuild = lastLen !== chars.length || a.querySelector('.ghost');
      if (rebuild) {
        a.innerHTML = '<span class="cur" aria-hidden="true">¥</span>';
        chars.forEach(function (c) {
          if (/\d/.test(c)) {
            var col = document.createElement('span'); col.className = 'col'; col.setAttribute('aria-hidden', 'true');
            var strip = document.createElement('span'); strip.className = 'strip'; strip.style.setProperty('--d', 0);
            for (var i = 0; i < 10; i++) { var d = document.createElement('span'); d.textContent = i; strip.appendChild(d); }
            col.appendChild(strip); a.appendChild(col);
          } else {
            var sp = document.createElement('span'); sp.className = 'sep'; sp.textContent = c; sp.setAttribute('aria-hidden', 'true'); a.appendChild(sp);
          }
        });
        void a.offsetWidth;
      }
      var strips = a.querySelectorAll('.strip'), digits = chars.filter(function (c) { return /\d/.test(c); }), n = digits.length, changed = 0;
      strips.forEach(function (st, i) {
        var target = +digits[i], now = +st.style.getPropertyValue('--d') || 0;
        if (target !== now || rebuild) { st.style.setProperty('--delay', ((n - 1 - i) * 0.045) + 's'); changed++; } else { st.style.setProperty('--delay', '0s'); }
        st.style.setProperty('--d', target);
      });
      lastLen = chars.length;
    }

    function view() {
      if (s.state === 'loading') return 'loading';
      return s.state;
    }

    function render() {
      var loading = s.state === 'loading';
      root.dataset.view = view();
      // 收款人 / 备注：字段还没到就显示骨架
      if (s.payee == null || loading) { el.payee.innerHTML = '<span class="skbar"></span>'; el.memo.innerHTML = '<span class="skbar s"></span>'; el.memo.className = 'memo'; }
      else {
        el.payee.textContent = s.payee; el.payee.title = '转给 ' + s.payee;
        if (s.risk === 'first-time-payee' && (s.state === 'ready' || s.state === 'error')) { el.memo.className = 'memo risk'; el.memo.textContent = '首次收款人'; }
        else { el.memo.className = 'memo'; el.memo.textContent = s.memo || s.account || ''; }
      }
      renderAmount();

      // 航线
      if (s.state === 'done') { if (p < .999) sail(1, 900, function () { setProg(1); }); else setProg(1); }
      else if (s.state === 'confirming') { sail(.92, 1500); }
      else if (s.state === 'error') { sail(.52, 600); }
      else if (s.state === 'cancelled') { setProg(0); }
      else { cancelAnimationFrame(anim); setProg(0); }

      // 按钮
      var go = el.go, label = '', tone = '', dis = false, icon = '';
      var ready = s.payee != null && s.amount != null;
      if (loading || !ready) { label = loading ? '正在备航…' : '等待信息…'; tone = 'wait'; dis = true; }
      else if (s.state === 'ready') { if (armed) { label = '再点一次确认'; tone = 'armed'; } else label = '确认转账'; }
      else if (s.state === 'confirming') { label = '航行中…'; tone = 'wait'; dis = true; }
      else if (s.state === 'done') { label = '已到账 ' + (s.doneAt || hhmm()); tone = 'ghost'; dis = true; icon = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 4.5"/></svg>'; }
      else if (s.state === 'error') { label = '重试'; tone = 'armed'; }
      else if (s.state === 'cancelled') { label = '已取消'; tone = 'ghost'; dis = true; }
      go.innerHTML = icon + '<span>' + label + '</span>'; go.dataset.tone = tone; go.disabled = dis;
      el.rose.disabled = loading;

      var say = loading ? '加载中' : s.state === 'done' ? '已到账' : s.state === 'error' ? ('转账失败：' + (s.error || '网络中断')) : s.state === 'cancelled' ? '已取消转账' : s.state === 'confirming' ? '转账中' : armed ? '请再点一次确认' : '';
      if (say !== lastSpoken) { el.live.textContent = say; lastSpoken = say; }
    }

    function openMenu(open) {
      root.classList.toggle('menu-open', open);
      el.rose.setAttribute('aria-expanded', open);
      if (open) { el.legend.removeAttribute('inert'); setTimeout(function () { el.edit.focus(); }, 50); }
      else { el.legend.setAttribute('inert', ''); }
    }
    function settle() {
      clearTimeout(settleTimer);
      if (opts.autoSettle === false) return;
      settleTimer = setTimeout(function () { api.set({ state: 'done', doneAt: hhmm() }); }, 1700);
    }

    el.go.addEventListener('click', function () {
      if (s.state === 'ready') {
        if (s.risk === 'first-time-payee' && !armed) { armed = true; render(); clearTimeout(armTimer); armTimer = setTimeout(function () { armed = false; render(); }, 4000); return; }
        armed = false; clearTimeout(armTimer);
        emit('confirm', { payee: s.payee, amount: s.amount, currency: s.currency });
        api.set({ state: 'confirming' }); settle();
      } else if (s.state === 'error') {
        emit('retry', { payee: s.payee, amount: s.amount });
        api.set({ state: 'confirming', error: null }); settle();
      }
    });
    el.rose.addEventListener('click', function () { openMenu(!root.classList.contains('menu-open')); });
    el.edit.addEventListener('click', function () { openMenu(false); emit('edit-amount', { amount: s.amount, currency: s.currency }); el.rose.focus(); });
    el.cancel.addEventListener('click', function () { openMenu(false); emit('cancel', { payee: s.payee, amount: s.amount }); clearTimeout(settleTimer); api.set({ state: 'cancelled' }); el.go.focus(); });
    root.addEventListener('keydown', function (e) { if (e.key === 'Escape' && root.classList.contains('menu-open')) { openMenu(false); el.rose.focus(); } });

    var api = {
      set: function (partial) {
        if (partial && partial.state && partial.state !== 'ready') { armed = false; clearTimeout(armTimer); }
        if (partial && partial.state === 'loading') { clearTimeout(settleTimer); }
        Object.assign(s, partial || {}); render(); return api;
      },
      get: function () { return Object.assign({}, s); }
    };
    api.set(init || {});
    return api;
  }

  /* ---------- 示例数据（考研倒数第 37 天） ---------- */
  var READY = { state: 'ready', payee: '考研自习室', account: '尾号 4821', amount: 300, currency: 'CNY', memo: '11 月 · 押金', risk: 'normal', error: null };
  var FIRST = { state: 'ready', payee: '考研资料店 王老板', account: '尾号 7730', amount: 486.5, memo: '真题合订本 ×2', risk: 'first-time-payee', error: null };

  var main = mount(document.getElementById('main-card'), { state: 'loading' }, { global: true });
  window.card = { set: function (p) { return main.set(p); }, get: main.get };
  setTimeout(function () { main.set(READY); }, 500);

  /* ---------- Agent 回传小条 ---------- */
  var log = document.getElementById('log');
  document.addEventListener('hx-action', function (e) {
    log.innerHTML = '<span class="k">hx-action</span> ' + JSON.stringify(e.detail, null, 2).replace(/</g, '&lt;');
  });

  /* ---------- 模拟 Agent ---------- */
  var sims = [
    ['加载中', function () { main.set({ state: 'loading' }); }],
    ['正常', function () { main.set(READY); }],
    ['流式到达', function () {
      main.set({ state: 'ready', payee: null, amount: null, memo: null, risk: 'normal' });
      setTimeout(function () { main.set({ payee: '考研自习室' }); }, 500);
      setTimeout(function () { main.set({ amount: 300 }); }, 1100);
      setTimeout(function () { main.set({ memo: '11 月 · 押金' }); }, 1700);
    }],
    ['首次收款人', function () { main.set(FIRST); }],
    ['改金额 → 1,280.00', function () { main.set({ amount: 1280 }); }],
    ['改金额 → 300.00', function () { main.set({ amount: 300 }); }],
    ['出错', function () { main.set({ state: 'error', error: '网络中断，未扣款' }); }],
    ['已到账', function () { main.set({ state: 'done', doneAt: '14:32' }); }]
  ];
  var simBox = document.getElementById('sim');
  sims.forEach(function (x) {
    var b = document.createElement('button'); b.type = 'button'; b.className = 'chipbtn'; b.textContent = x[0]; b.addEventListener('click', x[1]); simBox.appendChild(b);
  });

  /* ---------- 全部状态 ---------- */
  var g = document.getElementById('gallery');
  [
    ['加载（骨架）', { state: 'loading' }],
    ['正常', READY],
    ['首次收款人', FIRST],
    ['航行中', Object.assign({}, READY, { state: 'confirming' }), false],
    ['出错', Object.assign({}, READY, { state: 'error', error: '网络中断，未扣款' })],
    ['已到账', Object.assign({}, READY, { state: 'done', doneAt: '14:32' })],
    ['已取消', Object.assign({}, READY, { state: 'cancelled' })]
  ].forEach(function (x) {
    var cell = document.createElement('div'); cell.className = 'cell';
    cell.innerHTML = '<div class="label">' + x[0] + '</div><div class="stage"><div class="wg"></div></div>';
    g.appendChild(cell);
    mount(cell.querySelector('.wg'), x[1], { autoSettle: x[2] });
  });

  /* ---------- 页面开关 ---------- */
  var zoom = document.getElementById('zoom'), theme = document.getElementById('theme'), root = document.documentElement;
  zoom.addEventListener('click', function () {
    var on = zoom.getAttribute('aria-pressed') !== 'true'; zoom.setAttribute('aria-pressed', on);
    zoom.textContent = on ? '回到 1×' : '放大到 2×'; document.querySelector('.stage-col').style.setProperty('--z', on ? 2 : 1);
  });
  theme.addEventListener('click', function () {
    var on = theme.getAttribute('aria-pressed') !== 'true'; theme.setAttribute('aria-pressed', on);
    root.setAttribute('data-theme', on ? 'dark' : 'light'); theme.textContent = on ? '白昼（浅色）' : '夜航（深色）';
  });
})();
</script>
