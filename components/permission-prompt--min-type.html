.btns { display: flex; flex-wrap: wrap; gap: 0 26px; padding-bottom: 2px; }

<body>
<div class="page">
  <header class="head">
    <div>
      <h1>权限确认卡 · 极简字排</h1>
      <p>Agent 要做一件有影响的事之前，停下来问你。字段一个个流进来，位置从一开始就留好，不会跳动。</p>
      <p>适合的 harness：通用核心（任何 harness 都要有）</p>
    </div>
    <button type="button" class="pbtn" id="theme" aria-pressed="false">深色</button>
  </header>

  <section class="sec" aria-label="主卡片">
    <h2>可交互 · Y 允许一次（高风险要按住），A 改用备选，N 拒绝并说明</h2>
    <div id="main"></div>
    <h2>模拟 Agent</h2>
    <div class="simbar" id="sim"></div>
    <h2>Agent 回传</h2>
    <pre class="log" id="log" aria-live="polite">（允许、改用备选、拒绝，这里显示 hx-action）</pre>
  </section>

  <section class="gal" aria-label="全部状态">
    <h2>全部状态</h2>
    <div class="sec" id="gallery"></div>
  </section>
</div>

<script>
(function () {
  'use strict';

  var TEMPLATE =
    '<div class="top"><i class="dot" aria-hidden="true"></i><span data-f="label">需要你确认</span><span class="w" data-f="wait"></span></div>' +
    '<div class="slot act" data-f="act"><div class="sk" aria-hidden="true"><i class="bar" style="width:86%"></i><i class="bar" style="width:52%"></i></div><div class="tx" data-f="acttx"></div></div>' +
    '<ul class="imps" data-f="imps" aria-label="这会带来什么影响"></ul>' +
    '<div class="slot alt" data-f="alt"><div class="sk" aria-hidden="true"><i class="bar" style="width:58%"></i></div><div class="tx"><span class="lb">Agent 的备选</span><span data-f="alttx"></span></div></div>' +
    '<div class="ctl" data-f="ctl"><div><div class="btns">' +
      '<button type="button" class="btn" data-f="allow"><span data-f="allowlb">允许一次</span><kbd>Y</kbd><i class="u"></i><i class="hold" data-f="hold"></i></button>' +
      '<button type="button" class="btn sec2" data-f="altbtn"><span>改用备选</span><kbd>A</kbd><i class="u"></i></button>' +
      '<button type="button" class="btn sec2" data-f="denybtn"><span>拒绝并说明</span><kbd>N</kbd><i class="u"></i></button>' +
    '</div><p class="hint" data-f="hint"></p></div></div>' +
    '<div class="deny" data-f="deny"><div><label data-f="denylb">告诉 Agent 为什么（可选）</label><div class="line">' +
      '<input type="text" data-f="reason" placeholder="例如：先别通知教练">' +
      '<button type="button" class="btn" data-f="send"><span>发送</span><kbd>⏎</kbd><i class="u"></i></button>' +
      '<button type="button" class="btn sec2" data-f="cancel"><span>取消</span><kbd>Esc</kbd><i class="u"></i></button></div></div></div>' +
    '<div class="st"><div><div class="stl" data-f="stl"></div></div></div>' +
    '<div class="sr" aria-live="polite" data-f="live"></div>';

  var fmtWait = function (s) { return '已等待 ' + Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); };

  /**
   * props: { state: 'loading'|'ready'|'allowed'|'alt'|'denied'|'error', risk: 'normal'|'high', waited,

    var s = { state: 'loading', risk: 'normal', waited: 0, action: null, impacts: [], alt: null, reason: null, executed: false, error: null };
    var impRows = [], waitTimer = 0, holdRaf = 0, holdT0 = 0, holdKey = null, lastSay = '';

      var imps = loading ? [] : (s.impacts || []);
      ensureRows(Math.max(ROWS, imps.length));
      var complete = !loading && s.action != null && s.alt != null && imps.length > 0;
      root.dataset.done = complete ? '1' : '0';
      impRows.forEach(function (r, i) {
        var d = imps[i];

        if (d) { r.tx.querySelector('.k').textContent = d.k; r.tx.querySelector('.t').innerHTML = d.irreversible ? '<span class="irr">' + esc(d.t) + '</span>' : esc(d.t); var sig = d.k + d.t; if (r.tx._v !== sig) { var was = r.slot.classList.contains('f'); r.tx._v = sig; r.slot.classList.add('f'); if (was) r.tx.animate([{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }], { duration: 480 * K, easing: EASE }); } }
        else { r.slot.classList.remove('f'); r.tx._v = null; }

      fill(el.alt, el.alttx, loading ? null : s.alt);

      el.label.textContent = { loading: '需要你确认', ready: '需要你确认', allowed: '已允许', alt: '已改用备选', denied: '已拒绝', error: '没成功' }[s.state];
      el.wait.textContent = (s.state === 'ready' || loading) ? (loading ? '' : fmtWait(s.waited)) : '';
      var ready = s.state === 'ready' && complete;
      el.allow.disabled = el.altbtn.disabled = el.denybtn.disabled = !ready;
      el.allowlb.textContent = s.risk === 'high' ? '按住允许一次' : '允许一次';
      el.hint.textContent = ready ? (s.risk === 'high' ? '这件事发出后不能撤回，所以要按住约 1 秒才算数' : '') : (loading || s.state === 'ready' ? '正在等 Agent 把话说完…' : '');
      if (s.state !== 'ready') { el.deny.classList.remove('open'); }

      var st = '', say = '';
      if (s.state === 'allowed') { st = '<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path class="draw" d="M3 10.5l4.5 4.5L17 5"/></svg><span>已允许一次 · ' + (s.executed ? '已完成' : '正在执行') + '</span>'; say = '已允许一次'; }
      else if (s.state === 'alt') { st = '<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path class="draw" d="M3 10.5l4.5 4.5L17 5"/></svg><span>已改用备选：' + esc(s.alt || '') + '</span>'; say = '已改用备选'; }
      else if (s.state === 'denied') { st = '<span>已拒绝，Agent 不会执行</span>' + (s.reason ? '<span class="why">你的说明：' + esc(s.reason) + '</span>' : ''); say = '已拒绝'; }
      else if (s.state === 'error') { st = '<span class="msg">' + esc(s.error || '没送出去') + '</span><button type="button" data-f="retry">重试</button>'; say = '没成功：' + (s.error || ''); }
      if (el.stl._h !== st) { el.stl._h = st; el.stl.innerHTML = st; var rb = el.stl.querySelector('[data-f="retry"]'); if (rb) rb.addEventListener('click', function () { emit('retry', {}); api.set({ state: 'loading', error: null }); if (opts.demo && opts.autoSettle !== false) setTimeout(function () { api.set(opts.demo()); }, 900); }); }
      if (say && say !== lastSay) { lastSay = say; el.live.textContent = say; }

      clearInterval(waitTimer);
      if (s.state === 'ready') waitTimer = setInterval(function () { s.waited += 1; el.wait.textContent = fmtWait(s.waited); }, 1000);
    }

    /* 允许：普通风险点一下；高风险要按住 */
    function holdStart(key) {
      if (el.allow.disabled || s.state !== 'ready') return;
      if (s.risk !== 'high') { doAllow(); return; }

      (function loop(now) { var p = Math.min(1, (now - holdT0) / (HOLD_MS * K)); el.hold.style.transform = 'scaleX(' + p + ')'; if (p >= 1) { holdEnd(true); doAllow(); } else holdRaf = requestAnimationFrame(loop); })(holdT0);
    }
    function holdEnd(done) { cancelAnimationFrame(holdRaf); holdRaf = 0; holdKey = null; if (!done) { el.hold.style.transition = ''; el.hold.style.transform = 'scaleX(0)'; } else { el.hold.style.transition = ''; setTimeout(function () { el.hold.style.transform = 'scaleX(0)'; }, 400); } }
    function doAllow() { emit('allow-once', { risk: s.risk }); api.set({ state: 'allowed', executed: false }); if (opts.autoSettle !== false) setTimeout(function () { api.set({ executed: true }); }, 1800); }
    function doAlt() { if (s.state !== 'ready' || el.altbtn.disabled) return; emit('use-alternative', { alt: s.alt }); api.set({ state: 'alt' }); }
    function openDeny() { if (s.state !== 'ready' || el.denybtn.disabled) return; el.deny.classList.add('open'); setTimeout(function () { el.reason.focus(); }, 80); }
    function sendDeny() { var r = el.reason.value.trim(); emit('deny', { reason: r }); el.reason.value = ''; api.set({ state: 'denied', reason: r || null }); }

    el.allow.addEventListener('pointerdown', function (e) { if (s.risk === 'high') { e.preventDefault(); el.allow.focus(); holdStart('pointer'); } });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) { el.allow.addEventListener(ev, function () { if (holdKey === 'pointer') holdEnd(false); }); });
    el.allow.addEventListener('click', function () { if (s.risk !== 'high') holdStart('click'); });
    el.allow.addEventListener('keydown', function (e) { if ((e.key === 'Enter' || e.key === ' ') && s.risk === 'high') { e.preventDefault(); if (!e.repeat) holdStart('key'); } });
    el.allow.addEventListener('keyup', function (e) { if ((e.key === 'Enter' || e.key === ' ') && holdKey === 'key') holdEnd(false); });
    el.altbtn.addEventListener('click', doAlt); el.denybtn.addEventListener('click', openDeny);
    el.send.addEventListener('click', sendDeny); el.cancel.addEventListener('click', function () { el.deny.classList.remove('open'); el.denybtn.focus(); });
    el.reason.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); sendDeny(); } if (e.key === 'Escape') { el.deny.classList.remove('open'); el.denybtn.focus(); } });

    /* 快捷键：Y / A / N（只在这张卡里有焦点，或它是页面的主卡片且没有在输入文字时生效） */
    function keys(e) {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      var t = e.target, typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA');
      if (typing) return; var k = e.key.toLowerCase();
      if (k === 'y') { e.preventDefault(); if (!e.repeat) holdStart('key'); } else if (k === 'a') { e.preventDefault(); doAlt(); } else if (k === 'n') { e.preventDefault(); openDeny(); }
    }
    function keyup(e) { if (e.key.toLowerCase() === 'y' && holdKey === 'key') holdEnd(false); }
    if (opts.global) { document.addEventListener('keydown', keys); document.addEventListener('keyup', keyup); }
    else { root.addEventListener('keydown', keys); root.addEventListener('keyup', keyup); }

    var api = {
      set: function (p) { Object.assign(s, p || {}); if (p && p.impacts) s.impacts = p.impacts.slice(); render(); return api; },
      get: function () { return JSON.parse(JSON.stringify(s)); }
    };
    api.set(init || {});
    return api;
  }

  /* ---------- 示例数据（跑第一次半程马拉松，膝盖不舒服） ---------- */
  var NORMAL = { state: 'ready', risk: 'normal', waited: 42, error: null, executed: false, reason: null,
    action: '把本周六的长跑从 18 公里改成 12 公里',
    impacts: [{ k: '日历', t: '改写 1 个事件，随时可撤销' }, { k: '训练记录', t: '不改动' }],
    alt: '先不改，周四再看膝盖恢复得怎么样' };
  var HIGH = { state: 'ready', risk: 'high', waited: 42, error: null, executed: false, reason: null,
    action: '把未来 5 周的长跑改短，并通知教练',
    impacts: [{ k: '日历', t: '改写 5 个事件，7 天内可撤销' }, { k: '教练', t: '发送 1 条消息，发出后不能撤回', irreversible: true }, { k: '训练记录', t: '不改动' }],
    alt: '只改本周的 1 次，不通知教练' };

  var main = mount(document.getElementById('main'), { state: 'loading' }, { global: true, demo: function () { return HIGH; } });
  window.card = { set: function (p) { return main.set(p); }, get: main.get };
  setTimeout(function () { main.set(HIGH); }, 600);

  var log = document.getElementById('log');
  document.addEventListener('hx-action', function (e) { log.textContent = 'hx-action ' + JSON.stringify(e.detail); });

  var sims = [
    ['加载中', function () { main.set({ state: 'loading', waited: 0 }); }],
    ['普通风险', function () { main.set(NORMAL); }],
    ['高风险（要按住）', function () { main.set(HIGH); }],
    ['流式到达', function () {
      main.set({ state: 'ready', risk: 'high', waited: 0, action: null, impacts: [], alt: null, reason: null, error: null });
      setTimeout(function () { main.set({ action: HIGH.action }); }, 700);
      HIGH.impacts.forEach(function (_, i) { setTimeout(function () { main.set({ impacts: HIGH.impacts.slice(0, i + 1) }); }, 1400 + i * 650); });
      setTimeout(function () { main.set({ alt: HIGH.alt }); }, 3500);
    }],
    ['出错', function () { main.set({ state: 'error', error: '日历服务没有响应，什么都没有改' }); }]
  ];
  var bar = document.getElementById('sim');
  sims.forEach(function (x) { var b = document.createElement('button'); b.type = 'button'; b.className = 'pbtn'; b.textContent = x[0]; b.addEventListener('click', x[1]); bar.appendChild(b); });

  var g = document.getElementById('gallery');
  [
    ['加载（位置已留好）', { state: 'loading' }],
    ['流式到达中（只到了一半）', { state: 'ready', risk: 'high', waited: 3, action: HIGH.action, impacts: HIGH.impacts.slice(0, 1), alt: null }],
    ['普通风险', NORMAL],
    ['高风险（按住允许）', HIGH],
    ['已允许', Object.assign({}, HIGH, { state: 'allowed', executed: true })],
    ['已改用备选', Object.assign({}, HIGH, { state: 'alt' })],
    ['已拒绝（附说明）', Object.assign({}, HIGH, { state: 'denied', reason: '先别通知教练，我想自己跟他说' })],
    ['出错（可重试）', Object.assign({}, HIGH, { state: 'error', error: '日历服务没有响应，什么都没有改' })]
  ].forEach(function (x) {
    var cell = document.createElement('div'); cell.className = 'sec';
    cell.innerHTML = '<h2>' + x[0] + '</h2><div></div>'; g.appendChild(cell);
    mount(cell.lastChild, x[1], { demo: function () { return HIGH; } });
  });

  var theme = document.getElementById('theme'), rootEl = document.documentElement;
  theme.addEventListener('click', function () {
    var on = theme.getAttribute('aria-pressed') !== 'true'; theme.setAttribute('aria-pressed', on);
    rootEl.setAttribute('data-theme', on ? 'dark' : 'light'); theme.textContent = on ? '浅色' : '深色';
  });
})();
</script>
