        '<div class="btns"><button type="button" class="pb" data-f="copy">复制</button><button type="button" class="pb" data-f="speak">朗读</button></div></div>' +
    '</div>' +
    '<button type="button" class="lever" data-f="lever" aria-label="拉杆：换一种说法"><svg width="48" height="130" viewBox="0 0 48 130" aria-hidden="true">' +
      '<g class="arm"><rect x="5" y="50" width="6" height="64" rx="3" fill="#D2AA5E"/><circle cx="8" cy="40" r="12" fill="#C0392B"/><circle cx="4" cy="36" r="4" fill="rgba(255,255,255,.55)"/></g>' +
      '<rect x="-2" y="92" width="22" height="30" rx="5" fill="#8F6E2E"/><rect x="-2" y="92" width="22" height="7" rx="3.5" fill="#F0D590"/></svg></button>' +
    '</div><div class="sr" aria-live="polite" data-f="live"></div>';

  var STYLES = [['casual', '随意'], ['polite', '礼貌'], ['formal', '敬语']];

  /**
   * props: { state: 'loading'|'ready'|'error', source, style, variant, reels:[[…],[…],[…]],
   *          parts:[a,b,c]（还没到的填 null）, reading, gloss, note:{tone:'ok'|'warn', text}, error }
   * 动作（hx-action）：change-style { style, variant } / copy { text } / speak { text, lang }
   */
  function mount(root, init, opts) {
    opts = opts || {};
    root.innerHTML = TEMPLATE;
    var $ = function (f) { return root.querySelector('[data-f="' + f + '"]'); };
    var el = {}; ['fit', 'machine', 'lamps', 'src', 'reels', 'reading', 'gloss', 'slamp', 'stext', 'styles', 'copy', 'speak', 'lever', 'live'].forEach(function (k) { el[k] = $(k); });
    var group = 'st' + (++uid);
    STYLES.forEach(function (x) {
      var l = document.createElement('label'); l.innerHTML = '<input type="radio" name="' + group + '" value="' + x[0] + '"><span>' + x[1] + '</span>'; el.styles.appendChild(l);
    });
    var radios = el.styles.querySelectorAll('input');
    var lamps = el.lamps.querySelectorAll('i');
    var s = { state: 'loading', source: null, style: 'polite', variant: 0, reels: null, parts: [null, null, null], reading: null, gloss: null, note: null, error: null };
    var merged = false, noteTimer = 0, settleTimer = 0, measureCtx = document.createElement('canvas').getContext('2d');
    var reels = [0, 1, 2].map(function (i) {
      var d = document.createElement('div'); d.className = 'reel'; el.reels.appendChild(d);
      return new Reel(d, i, onStop, function (r) { Snd.tick(Math.abs(r.v), r.i); });
    });

    function emit(name, params) {
      var ev = new CustomEvent('hx-action', { detail: { name: name, params: params || {} }, bubbles: !!opts.global });
      (opts.global ? document : root).dispatchEvent(ev);
    }
    function tw(t) { measureCtx.font = '700 14px "Noto Sans JP","Noto Sans SC",sans-serif'; return measureCtx.measureText(t).width; }

    /* 宽度：转轴默认按最长的字排；合成一句时收紧成文字的宽度 */
    function layout(animate) {
      var base = reels.map(function (r) { return clamp(Math.ceil(Math.max.apply(null, r.strip.map(tw))) + 8, 56, 170); });
      var sum = base.reduce(function (a, b) { return a + b; }, 0) + 12, cap = 324;
      if (sum > cap) base = base.map(function (w) { return Math.floor(w * cap / sum); });
      var want = base;
      if (merged) want = reels.map(function (r, i) { return Math.ceil(tw(r.strip[mod(Math.round(r.p), r.strip.length)] || '')) + 14; });
      reels.forEach(function (r, i) { if (!animate) r.el.style.transition = 'none'; r.el.style.width = want[i] + 'px'; });
      if (!animate) { void el.reels.offsetWidth; reels.forEach(function (r) { r.el.style.transition = ''; }); }
    }
    function setMerged(on, animate) { if (merged === on) return; merged = on; el.machine.classList.toggle('merged', on); layout(animate !== false); }

    function chase() {
      var seq = []; for (var k = 0; k < 14; k++) seq.push(k % 7);
      seq.forEach(function (i, n) { setTimeout(function () { lamps.forEach(function (l, j) { l.classList.toggle('hot', j === i); }); }, n * 55); });
      setTimeout(function () { lamps.forEach(function (l) { l.classList.add('hot'); }); }, seq.length * 55);
      setTimeout(function () { lamps.forEach(function (l) { l.classList.remove('hot'); }); }, seq.length * 55 + 420);
    }

    function onStop() {
      var all = reels.every(function (r) { return r.mode === 'rest'; });
      Snd.clunk();
      if (!all || s.state !== 'ready' || s.parts.some(function (x) { return x == null; })) return;
      setTimeout(function () {
        if (!reels.every(function (r) { return r.mode === 'rest'; })) return;
        var total = reels.reduce(function (a, r) { return a + Math.ceil(tw(r.strip[mod(Math.round(r.p), r.strip.length)])) + 14; }, 0);
        if (total > 324) return;                      // 放不下就不合成
        setMerged(true); chase(); Snd.chime();        // 这一下，是这张卡唯一精心做的动效
      }, 240);
    }

    function paint() {
      el.src.textContent = s.source || '';
      var ready = s.state === 'ready' && s.parts.every(function (x) { return x != null; });
      el.reading.textContent = ready ? (s.reading || '') : '';
      el.gloss.textContent = ready ? (s.gloss || '') : (s.state === 'loading' ? '' : '');
      var tone = '', text = '';
      if (s.state === 'loading') text = '正在翻译…';
      else if (s.state === 'error') { tone = 'err'; text = s.error || '翻译失败'; }
      else if (!ready) text = '正在翻译…';
      else if (s.note) { tone = s.note.tone; text = s.note.text; }
      el.slamp.setAttribute('data-t', tone); el.stext.textContent = text;
      radios.forEach(function (r) { r.checked = r.value === s.style; r.disabled = s.state === 'loading'; });
      el.copy.disabled = el.speak.disabled = !ready; el.lever.disabled = s.state === 'loading';
      el.machine.classList.toggle('jam-state', s.state === 'error');
      var say = ready ? '翻译结果：' + s.parts.join('') + '。' + (s.gloss || '') + (s.note ? s.note.text : '') : s.state === 'error' ? '翻译失败：' + (s.error || '') : '正在翻译';
      if (el.live.textContent !== say) el.live.textContent = say;
    }

    function drive(instant) {
      reels.forEach(function (r, i) {
        var strip = (s.reels && s.reels[i]) ? s.reels[i].slice() : [''];
        if (s.parts[i] != null && strip.indexOf(s.parts[i]) < 0) strip.push(s.parts[i]);
        r.setStrip(strip);
      });
      layout(false);
      reels.forEach(function (r, i) {
        var part = s.parts[i], idx = part != null ? r.strip.indexOf(part) : -1, key;
        if (s.state === 'error') key = 'jam'; else if (s.state === 'loading') key = 'idle'; else if (part == null) key = 'spin'; else key = 'land:' + part;
        if (r.key === key) return; r.key = key;
        if (key === 'idle') r.startSpin(true);
        else if (key === 'spin') { setMerged(false); r.startSpin(false); }
        else if (key === 'jam') { setMerged(false); if (instant) r.place(Math.round(r.p), true); else r.landTo(mod(Math.round(r.p), r.strip.length), i * 300, true); }
        else { setMerged(false); if (instant) r.place(idx); else r.landTo(idx, i * 360); }
      });
      if (instant && s.state === 'ready' && s.parts.every(function (x) { return x != null; })) setMerged(true, false);
      if (!instant && s.state === 'error') { el.machine.classList.remove('jam'); void el.machine.offsetWidth; el.machine.classList.add('jam'); setTimeout(Snd.buzz.bind(Snd), 700); }
      paint();
    }

    function spinNow() { api.set({ state: 'ready', parts: [null, null, null], reading: null, gloss: null, note: null }); }
    function settle(style, variant) {
      if (opts.autoSettle === false || !opts.demo) return;
      clearTimeout(settleTimer); settleTimer = setTimeout(function () { api.set(opts.demo(style, variant)); }, 900);
    }
    function chooseStyle(style) {
      if (style === s.style && s.state === 'ready' && s.parts.every(function (x) { return x != null; }) === false) return;
      emit('change-style', { style: style, variant: 0 }); s.style = style; s.variant = 0; spinNow(); settle(style, 0);
    }
    radios.forEach(function (r) { r.addEventListener('change', function () { if (r.checked) chooseStyle(r.value); }); });

    function pull() {
      if (el.lever.disabled) return;
      var v = (s.variant + 1) % 2; Snd.lever();
      emit('change-style', { style: s.style, variant: v }); s.variant = v; spinNow(); settle(s.style, v);
    }
    var lv = { y0: 0, drag: false, moved: false };
    el.lever.addEventListener('pointerdown', function (e) { if (el.lever.disabled) return; lv.y0 = e.clientY; lv.drag = true; lv.moved = false; el.lever.classList.add('drag'); el.lever.setPointerCapture(e.pointerId); });
    el.lever.addEventListener('pointermove', function (e) {
      if (!lv.drag) return; var dy = e.clientY - lv.y0; if (Math.abs(dy) > 4) lv.moved = true;
      el.lever.style.setProperty('--lv', clamp(dy / 70, 0, 1).toFixed(3));
    });
    function release(e) {
      if (!lv.drag) return; lv.drag = false; el.lever.classList.remove('drag');
      var f = parseFloat(el.lever.style.getPropertyValue('--lv')) || 0; el.lever.style.setProperty('--lv', 0);
      if (lv.moved && f > 0.45) pull();
    }
    el.lever.addEventListener('pointerup', release); el.lever.addEventListener('pointercancel', release);
    el.lever.addEventListener('click', function (e) {
      if (lv.moved) { lv.moved = false; return; }
      el.lever.classList.add('pulled'); el.lever.style.setProperty('--lv', 1);
      setTimeout(function () { el.lever.classList.remove('pulled'); el.lever.style.setProperty('--lv', 0); }, 170); pull();
    });

    el.copy.addEventListener('click', function () {
      var text = s.parts.join(''); emit('copy', { text: text }); Snd.pop();
      try { if (navigator.clipboard) navigator.clipboard.writeText(text).catch(function () {}); } catch (e) {}
      var prev = s.note; clearTimeout(noteTimer); api.set({ note: { tone: 'ok', text: '已复制到剪贴板' } });
      noteTimer = setTimeout(function () { api.set({ note: prev && prev.text !== '已复制到剪贴板' ? prev : null }); }, 1800);
    });
    el.speak.addEventListener('click', function () { emit('speak', { text: s.parts.join(''), lang: 'ja-JP' }); Snd.pop(); });

    /* 等比缩放到容器宽度 */
    function fit() { var w = root.clientWidth || 420, k = Math.min(1, w / 420); el.fit.style.transform = 'scale(' + k + ')'; root.style.height = (el.fit.offsetHeight * k) + 'px'; }
    if (window.ResizeObserver) new ResizeObserver(fit).observe(root);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { layout(false); fit(); });

    var api = {
      set: function (p) { var first = !api._init; api._init = true; Object.assign(s, p || {}); drive(first && !!opts.instant); fit(); return api; },
      get: function () { return Object.assign({}, s); }
    };
    api.set(init || {});
    return api;
  }

  /* ---------- 示例数据（去大阪出差，问路去难波站） ---------- */
  var REELS = [
    ['すみません、', 'あの、', 'ちょっと', 'ねえ、', '失礼ですが、', '恐れ入ります、'],
    ['難波駅へは', '難波駅は', 'なんば駅は'],
    ['どう行きますか？', 'どこですか？', 'どっち？', 'どう行く？', 'どちらでしょうか？', 'どちらですか？']
  ];
  var DEMO = {
    polite: [
      { parts: ['すみません、', '難波駅へは', 'どう行きますか？'], reading: 'sumimasen, Nanba-eki e wa dō ikimasu ka?', gloss: '不好意思，去难波站怎么走？', note: { tone: 'ok', text: '礼貌 · 对陌生人合适' } },
      { parts: ['あの、', '難波駅は', 'どこですか？'], reading: 'ano, Nanba-eki wa doko desu ka?', gloss: '那个，难波站在哪里？', note: { tone: 'ok', text: '礼貌 · 对陌生人合适' } }],
    casual: [
      { parts: ['ちょっと', '難波駅は', 'どっち？'], reading: 'chotto, Nanba-eki wa dotchi?', gloss: '喂，难波站往哪边？', note: { tone: 'warn', text: '随意 · 对陌生人偏随意，只适合朋友' } },
      { parts: ['ねえ、', '難波駅は', 'どう行く？'], reading: 'nē, Nanba-eki wa dō iku?', gloss: '嘿，难波站怎么去？', note: { tone: 'warn', text: '随意 · 对陌生人偏随意，只适合朋友' } }],
    formal: [
      { parts: ['失礼ですが、', '難波駅へは', 'どちらでしょうか？'], reading: 'shitsurei desu ga, Nanba-eki e wa dochira deshō ka?', gloss: '冒昧打扰，请问难波站在哪一边？', note: { tone: 'ok', text: '敬语 · 对长辈和店员都稳妥' } },
      { parts: ['恐れ入ります、', '難波駅は', 'どちらですか？'], reading: 'osoreirimasu, Nanba-eki wa dochira desu ka?', gloss: '不好意思打扰了，难波站在哪边？', note: { tone: 'ok', text: '敬语 · 对长辈和店员都稳妥' } }]
  };
  var demo = function (style, v) { return Object.assign({ state: 'ready', source: SRC, style: style, variant: v, reels: REELS, error: null }, DEMO[style][v]); };
  var SRC = '请问去难波站怎么走？';
  var POLITE = demo('polite', 0);

  var machines = [];
  var main = mount(document.getElementById('main-card'), { state: 'loading', source: SRC, style: 'polite', reels: REELS }, { global: true, demo: demo });
  machines.push(main);
  window.card = { set: function (p) { return main.set(p); }, get: main.get };
  setTimeout(function () { main.set(POLITE); }, 900);

  var log = document.getElementById('log');
  document.addEventListener('hx-action', function (e) { log.textContent = 'hx-action ' + JSON.stringify(e.detail, null, 2); });

  var sims = [
    ['加载中', function () { main.set({ state: 'loading', parts: [null, null, null], note: null }); }],
    ['礼貌', function () { main.set(demo('polite', 0)); }],
    ['随意（预警）', function () { main.set(demo('casual', 0)); }],
    ['敬语', function () { main.set(demo('formal', 0)); }],
    ['流式到达', function () {
      var d = demo('polite', 1);
      main.set({ state: 'ready', source: SRC, style: 'polite', reels: REELS, parts: [null, null, null], reading: null, gloss: null, note: null });
      setTimeout(function () { main.set({ parts: [d.parts[0], null, null] }); }, 1100);
      setTimeout(function () { main.set({ parts: [d.parts[0], d.parts[1], null] }); }, 2000);
      setTimeout(function () { main.set({ parts: d.parts, reading: d.reading, gloss: d.gloss, note: d.note }); }, 2900);
    }],
    ['出错', function () { main.set({ state: 'error', error: '翻译服务超时，请再拉一次杆' }); }]
  ];
  var box = document.getElementById('sim');
  sims.forEach(function (x) { var b = document.createElement('button'); b.type = 'button'; b.className = 'pbtn'; b.textContent = x[0]; b.addEventListener('click', x[1]); box.appendChild(b); });

  var g = document.getElementById('gallery');
  [
    ['加载中（转轴慢转）', { state: 'loading', source: SRC, style: 'polite', reels: REELS }],
    ['礼貌（合成一句）', POLITE],
    ['随意（预警）', demo('casual', 0)],
    ['敬语', demo('formal', 0)],
    ['出错（转轴卡住）', { state: 'error', source: SRC, style: 'polite', reels: REELS, parts: ['あの、', '難波駅は', 'どこですか？'], error: '翻译服务超时，请再拉一次杆' }],
    ['已复制', Object.assign({}, POLITE, { note: { tone: 'ok', text: '已复制到剪贴板' } })]
  ].forEach(function (x) {
    var cell = document.createElement('div'); cell.className = 'cell';
    cell.innerHTML = '<div class="lab">' + x[0] + '</div><div class="mc"></div>'; g.appendChild(cell);
    machines.push(mount(cell.querySelector('.mc'), x[1], { instant: true, demo: demo }));
  });

  var snd = document.getElementById('sound'), theme = document.getElementById('theme'), rootEl = document.documentElement;
  snd.addEventListener('click', function () {
    var on = snd.getAttribute('aria-pressed') !== 'true'; snd.setAttribute('aria-pressed', on); snd.textContent = on ? '音效：开' : '音效：关'; Snd.on = on; if (on) { Snd.get(); Snd.pop(); }
  });
  theme.addEventListener('click', function () {
    var on = theme.getAttribute('aria-pressed') !== 'true'; theme.setAttribute('aria-pressed', on);
    rootEl.setAttribute('data-theme', on ? 'dark' : 'light'); theme.textContent = on ? '浅色页面' : '深色页面';
  });
})();
